name: Run specs

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ruby:2.7

    steps:
      - name: Checkout project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: |
          gem install bundler -v 2.4.22
          bundle install --jobs 4 --retry 3
      - name: Run tests
        env:
          RAILS_ENV: test
        run: |
          bundle exec rspec
      - name: Run rubocop
        run: |
          bundle exec rubocop
